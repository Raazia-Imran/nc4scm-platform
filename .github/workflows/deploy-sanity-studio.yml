name: Deploy Sanity Studio

on:
  push:
    branches:
      - main
      - feat/content-ui-revamp
    paths:
      - "cms-backend/**"
      - ".github/workflows/deploy-sanity-studio.yml"
  workflow_dispatch:

concurrency:
  group: sanity-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cms-backend
    env:
      CI: "true"
      SANITY_STUDIO_PROJECT_ID: dxinqb51
      SANITY_STUDIO_DATASET: production
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms-backend/package-lock.json

      - name: Install locked dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Verify approved content mapping
        id: verify
        run: npm run test:content

      - name: Import approved Word content once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: npm run seed:client

      - name: Publish approved homepage refresh once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-home-refresh.mjs

      - name: Publish curated homepage and supplied logos once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-home-story.mjs

      - name: Publish news articles team profiles and institutional copy once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-editorial-update.mjs --apply

      - name: Publish GCGC 2027 event and news announcement once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-october-2026-additions.mjs --apply

      - name: Publish supplied research assistant profiles once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-october-2026-additions.mjs --research-assistants --apply

      - name: Publish third-person team profiles once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/third-person-profiles.mjs

      - name: Publish supplied Azmat Chandio profile once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-azmat.mjs --apply

      - name: Publish compact team summaries and white portraits once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-team-directory-refresh.mjs --apply

      - name: Publish Finance member and Physics profile corrections once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-finance-physics.mjs --apply

      - name: Replace public RA listing and verify Physics wording once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-nausheen-directory.mjs --apply

      - name: Publish supplied portraits profiles and directory order once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-supplied-profiles-oct26.mjs --apply

      - name: Publish requested website and CMS developer card once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-digital-platforms-card.mjs --apply

      - name: Publish supplied Raazia full profile and portrait once
        if: github.ref == 'refs/heads/main'
        env:
          SANITY_CONTENT_WRITE_TOKEN: ${{ secrets.SANITY_CONTENT_WRITE_TOKEN }}
        run: node seed/import-raazia-profile.mjs --apply

      - name: Save pre-import backup
        # Each importer writes its snapshot before changing public content.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-content-backup
          path: cms-backend/seed/backups/
          if-no-files-found: ignore
          retention-days: 30

      - name: Deploy hosted Studio
        if: always() && steps.install.outcome == 'success' && steps.verify.outcome == 'success'
        run: ./node_modules/.bin/sanity deploy --no-minify --yes
